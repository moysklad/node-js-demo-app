services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: node_js_demo_app
      POSTGRES_USER: node_js_demo_app
      POSTGRES_PASSWORD: node_js_demo_app
    ports:
      - "${APP_DB_PORT:-5432}:5432"
    volumes:
      - node-js-demo-app-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U node_js_demo_app -d node_js_demo_app"]
      interval: 2s
      timeout: 3s
      retries: 15

  node-demo-app:
    build: .
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      APP_DB_HOST: postgres
      APP_DB_PORT: "5432"
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  node-js-demo-app-pgdata:
